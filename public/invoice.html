<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Invoice</title>
<style>
:root{--ac:#a67c1a}
*{box-sizing:border-box;margin:0}
body{background:#e9e7e2;font:14px/1.5 Inter,system-ui,Arial,sans-serif;color:#1c1a15;padding:16px}
.bar{max-width:794px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar button,.bar a{background:#1c1a15;color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 13px inherit;cursor:pointer;text-decoration:none}
.bar .g{background:#fff;color:#1c1a15;border:1px solid #cfcbc0}
.bar .wa{background:#25d366}
.bar .on{outline:2px solid var(--ac)}
.paper{max-width:794px;margin:0 auto;background:#fff;padding:40px 44px;box-shadow:0 6px 30px #0002;border-top:6px solid var(--ac)}
.hd{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid #e5e1d6}
.brand{display:flex;gap:14px;align-items:center}
.brand img{width:64px;height:64px;object-fit:contain}
.brand h1{font:700 28px Georgia,serif;color:var(--ac);line-height:1.1}
.brand p{color:#6b665a;font-size:12.5px}
.meta{text-align:right}
.meta h2{font:700 30px Georgia,serif;letter-spacing:3px;color:#1c1a15}
.meta p{color:#6b665a;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
.lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:4px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{background:#f6f2e7;text-align:left;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;padding:9px 8px;color:#4a463b}
td{padding:10px 8px;border-bottom:1px solid #eee9db;vertical-align:top}
.r{text-align:right}
.tot{margin:16px 0 0 auto;width:min(320px,100%)}
.tot div{display:flex;justify-content:space-between;padding:4px 0;color:#4a463b}
.tot .g{color:#1f8a4c}
.tot .t{border-top:2px solid #1c1a15;margin-top:6px;padding-top:9px;font:700 20px Georgia,serif;color:#1c1a15}
.pay{margin-top:16px;padding:10px 14px;border-radius:8px;background:#f6f2e7;font-weight:600}
.thanks{margin-top:22px;text-align:center;padding:22px 20px;border:1px dashed var(--ac);border-radius:12px}
.thanks b{display:block;font:700 26px Georgia,serif;color:var(--ac);margin-bottom:6px}
.terms{margin-top:14px;font-size:12px;color:#6b665a}
.foot{margin-top:18px;text-align:center;font-size:11.5px;color:#8a8576}
.err{max-width:520px;margin:60px auto;text-align:center;background:#fff;padding:30px;border-radius:12px}
/* slip (80mm receipt) */
body.slip{background:#fff;padding:0}
body.slip .bar{max-width:302px;margin:8px auto}
body.slip .paper{max-width:302px;width:302px;padding:10px 8px;box-shadow:none;border-top:0;font:12px/1.35 'Courier New',monospace;color:#000}
body.slip .hd{flex-direction:column;align-items:center;text-align:center;gap:6px;padding-bottom:8px;border-bottom:1px dashed #000}
body.slip .brand{flex-direction:column;gap:4px}
body.slip .brand img{width:52px;height:52px}
body.slip .brand h1{font:700 18px 'Courier New',monospace;color:#000}
body.slip .brand p,body.slip .meta p{color:#000;font-size:11px}
body.slip .meta{text-align:center}
body.slip .meta h2{font:700 14px 'Courier New',monospace;letter-spacing:2px}
body.slip .two{grid-template-columns:1fr;gap:6px;margin:8px 0}
body.slip .lbl{color:#000}
body.slip table{font-size:11.5px}
body.slip th{background:none;border-bottom:1px dashed #000;padding:3px 0;color:#000;font-size:10.5px}
body.slip td{padding:4px 0;border-bottom:0}
body.slip .hide-s{display:none}
body.slip .tot{width:100%;border-top:1px dashed #000;margin-top:8px;padding-top:6px}
body.slip .tot div{color:#000;padding:1px 0}
body.slip .tot .g{color:#000}
body.slip .tot .t{font:700 14px 'Courier New',monospace;border-top:1px dashed #000}
body.slip .pay{background:none;border:1px dashed #000;border-radius:0;padding:5px;margin-top:8px;text-align:center;font-size:11px}
body.slip .thanks{border:0;border-top:1px dashed #000;border-radius:0;padding:10px 0 0;margin-top:10px;font-size:11.5px}
body.slip .thanks b{font:700 14px 'Courier New',monospace;color:#000}
body.slip .terms,body.slip .foot{font-size:10px;color:#000}
@media print{body{background:#fff;padding:0}.bar{display:none}.paper{box-shadow:none;max-width:none;margin:0}body.slip .paper{width:100%}}
@media(max-width:620px){.paper{padding:22px 16px}.two{grid-template-columns:1fr}.meta{text-align:left}}
</style>
<style id="pg">@page{size:A4;margin:12mm}</style>
</head>
<body>
<div class="bar" id="bar" style="display:none">
  <button id="bPrint">Print / Save as PDF</button>
  <button class="g" id="bA4">A4 Invoice</button>
  <button class="g" id="bSlip">Slip (80mm)</button>
  <button class="wa" id="bWa" style="display:none">Send on WhatsApp</button>
</div>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');
const q=new URLSearchParams(location.search);
let DATA=null;
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='92'+d.slice(1);return d}
function render(){
  const {order:o,shop:s}=DATA;
  document.documentElement.style.setProperty('--ac',s.accent||'#a67c1a');
  document.title='Invoice '+o.id+' - '+s.shopName;
  const itemDisc=o.lines.reduce((a,l)=>a+(l.orig-l.unit)*l.qty,0);
  const listTotal=o.lines.reduce((a,l)=>a+l.orig*l.qty,0);
  const saved=itemDisc+o.discount;
  const d=new Date(o.createdAt);
  const date=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const cu=o.customer||{};
  const paid=o.source==='store'?`Paid: ${esc(o.payment)}`:(o.status==='delivered'?'Paid (Cash on Delivery)':`Payment: Cash on Delivery. Please pay ${rs(o.total)} when your parcel arrives.`);
  const rows=o.lines.map((l,i)=>`<tr><td class="hide-s">${i+1}</td><td><b>${esc(l.name)}</b><br><span style="color:#6b665a">${esc(l.size)} × ${l.qty}</span></td><td class="r hide-s">${rs(l.orig)}</td><td class="r hide-s">${l.orig>l.unit?'-'+rs((l.orig-l.unit)*l.qty):'—'}</td><td class="r">${rs(l.total)}</td></tr>`).join('');
  $('#root').innerHTML=`<div class="paper">
   <div class="hd"><div class="brand">${s.logo?`<img src="/api/img/${esc(s.logo)}" alt="">`:''}<div><h1>${esc(s.shopName)}</h1><p>${[s.address,s.phone&&'Phone: '+s.phone,s.instagram].filter(Boolean).map(esc).join('<br>')}</p></div></div>
    <div class="meta"><h2>${o.source==='store'?'RECEIPT':'INVOICE'}</h2><p><b>${esc(o.id)}</b><br>${esc(date)}</p></div></div>
   <div class="two"><div><div class="lbl">Billed to</div><b>${esc(cu.name||'Customer')}</b><br>${[cu.phone,cu.address,cu.city].filter(Boolean).map(esc).join('<br>')}</div>
    <div><div class="lbl">Order</div>${o.source==='store'?'In-store sale':'Online order'}<br>Status: ${esc(o.status)}${o.coupon?`<br>Coupon: ${esc(o.coupon)}`:''}</div></div>
   <table><thead><tr><th class="hide-s">#</th><th>Item</th><th class="r hide-s">Price</th><th class="r hide-s">Discount</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
   <div class="tot">
    <div><span>Subtotal (list price)</span><span>${rs(listTotal)}</span></div>
    ${itemDisc?`<div class="g"><span>Product discount</span><span>- ${rs(itemDisc)}</span></div>`:''}
    ${o.discount?`<div class="g"><span>${o.coupon?'Coupon ('+esc(o.coupon)+')':'Extra discount'}</span><span>- ${rs(o.discount)}</span></div>`:''}
    <div><span>Delivery</span><span>${o.delivery?rs(o.delivery):'FREE'}</span></div>
    <div class="t"><span>Total</span><span>${rs(o.total)}</span></div>
    ${saved?`<div class="g" style="margin-top:6px"><span>You saved</span><span>${rs(saved)}</span></div>`:''}
   </div>
   <div class="pay">${paid}</div>
   <div class="thanks"><b>Thank You!</b>${esc(s.invoiceNote||'')}</div>
   ${s.invoiceTerms?`<div class="terms"><b>Terms:</b> ${esc(s.invoiceTerms)}</div>`:''}
   <div class="foot">This is a computer generated ${o.source==='store'?'receipt':'invoice'} · ${esc(s.shopName)}</div>
  </div>`;
  $('#bar').style.display='flex';
  const num=waNum(cu.phone);
  if(num.length>=10){$('#bWa').style.display='';$('#bWa').onclick=()=>{
    const link=location.origin+'/invoice?id='+encodeURIComponent(o.id)+'&t='+encodeURIComponent(o.token||'');
    const msg=`Assalam o Alaikum ${cu.name||''},\nThank you for shopping with ${s.shopName}!\nOrder: ${o.id}\nTotal: ${rs(o.total)}\nYour invoice: ${link}`;
    window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank')}}
}
function mode(slip){document.body.classList.toggle('slip',slip);$('#bSlip').classList.toggle('on',slip);$('#bA4').classList.toggle('on',!slip);
  $('#pg').textContent=slip?'@page{size:80mm auto;margin:2mm}':'@page{size:A4;margin:12mm}'}
$('#bPrint').onclick=()=>window.print();$('#bA4').onclick=()=>mode(false);$('#bSlip').onclick=()=>mode(true);
mode(q.get('slip')==='1');
(async()=>{
  const id=q.get('id');
  if(!id){$('#root').innerHTML='<div class="err"><h2>Invoice nahi mila</h2></div>';return}
  try{const r=await fetch('/api/invoice/'+encodeURIComponent(id)+'?t='+encodeURIComponent(q.get('t')||''));
    if(!r.ok)throw 0;DATA=await r.json();render();if(q.get('print')==='1')setTimeout(()=>window.print(),400)}
  catch{$('#root').innerHTML='<div class="err"><h2>Invoice nahi mila</h2><p>Link sahi nahi hai ya order delete ho chuka hai.</p></div>'}
})();
</script>
</body>
</html>
