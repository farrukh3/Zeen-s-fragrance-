<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Zeen's Fragrance</title>
<style>
:root{--bg:#fbf7ee;--bg2:#fffdf8;--card:#ffffff;--card2:#fff9ea;--line:#eadfc4;--gold:#b88a2a;--gold2:#d9b25a;--ink:#2b2416;--mute:#7c705a;--red:#c8432d;--green:#2a9457;--blue:#2a78c8;--amber:#a87b0c;--r:16px;--sh:0 6px 22px rgba(150,115,40,.12);--side:232px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 520px at 85% -10%,#fff1c9 0,transparent 60%),var(--bg);background-attachment:fixed;background-attachment:fixed;color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,138,42,.18)}
input::placeholder,textarea::placeholder{color:#a89b80}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label{display:grid;gap:5px;color:var(--mute);font-size:12px;font-weight:500}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1608;font-weight:600;border-radius:10px;padding:10px 18px;box-shadow:0 4px 14px rgba(184,138,42,.22);transition:transform .12s,filter .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.g{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:none}.btn.g:hover{border-color:var(--gold);background:rgba(184,138,42,.08)}
.btn.r{background:rgba(240,112,90,.07);border:1px solid rgba(240,112,90,.55);color:var(--red);box-shadow:none}.btn.r:hover{background:rgba(240,112,90,.15)}
.btn.s{padding:6px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:linear-gradient(160deg,#fff8e4,#ffffff);border:1px solid var(--line);border-radius:22px;padding:34px 30px;width:min(400px,100%);display:grid;gap:14px;box-shadow:var(--sh)}
.lbox h1{font:700 30px Georgia,serif;color:var(--gold);text-align:center}
.lbox .mut{text-align:center}
.er{color:var(--red);font-size:13px;min-height:18px}

/* layout: sidebar on desktop, bottom nav on phone */
.shell{display:flex;min-height:100vh}
.side{width:var(--side);flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 12px;background:linear-gradient(180deg,#fffdf7,#fbf3dd);border-right:1px solid var(--line);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand img,.brand .lg0{width:38px;height:38px;border-radius:50%;object-fit:contain;background:var(--card);flex:none;display:grid;place-items:center;font:700 18px Georgia,serif;color:var(--gold);border:1px solid var(--line)}
.brand b{font:700 18px Georgia,serif;color:var(--gold);line-height:1.1}
.brand small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
.tab{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--mute);text-align:left;font-weight:500;transition:background .15s,color .15s;position:relative}
.tab svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:rgba(184,138,42,.09);color:var(--ink)}
.tab.on{background:linear-gradient(135deg,rgba(217,178,90,.28),rgba(184,138,42,.12));color:#8a6310;font-weight:600;box-shadow:inset 0 0 0 1px rgba(184,138,42,.35)}
.tab .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-style:normal;font-size:11px;font-weight:700;min-width:19px;height:19px;padding:0 6px;display:grid;place-items:center}
.sidefoot{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sidefoot .btn{text-align:center;text-decoration:none;display:block}
.who{font-size:12px;color:var(--mute);padding:0 4px}
.mtop{display:none}
.content{flex:1;min-width:0}
main{padding:26px 28px 40px;max-width:1240px;margin:0 auto}
h2{font:700 24px/1.2 Inter,system-ui,sans-serif;letter-spacing:-.3px;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:5px;height:22px;border-radius:4px;background:linear-gradient(var(--gold2),var(--gold));flex:none}
.panel h2,h2[style]{font-size:17px!important;font-weight:600;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:linear-gradient(155deg,#fff8e4,#ffffff);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(184,138,42,.16),transparent 70%)}
.stat span{color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:1.1px;font-weight:600}
.stat b{display:block;font-size:26px;font-weight:700;color:var(--gold);margin:3px 0 1px;letter-spacing:-.4px}
.stat small{font-size:12px}
.panel{background:linear-gradient(160deg,#ffffff,#fffaf0);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;overflow:auto;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;color:var(--mute);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;position:sticky;top:0;background:#fffaf0}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}tbody tr:hover{background:rgba(184,138,42,.06)}
tr:last-child td{border-bottom:0}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#f6efdc;display:block;border:1px solid var(--line)}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;border:1px solid var(--line);background:rgba(184,138,42,.07);white-space:nowrap}
.pill.pending{color:var(--amber);border-color:rgba(242,201,76,.45);background:rgba(242,201,76,.1)}
.pill.confirmed,.pill.shipped{color:var(--blue);border-color:rgba(108,182,255,.45);background:rgba(108,182,255,.1)}
.pill.delivered{color:var(--green);border-color:rgba(111,212,150,.45);background:rgba(111,212,150,.1)}
.pill.cancelled{color:var(--red);border-color:rgba(240,112,90,.45);background:rgba(240,112,90,.1)}
.low{color:var(--red);font-weight:600}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{width:auto;min-width:160px;flex:1 1 160px;max-width:260px}
.ov{position:fixed;inset:0;background:rgba(60,45,10,.45);backdrop-filter:blur(4px);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.ov.on{display:flex}
.modal{background:linear-gradient(160deg,#ffffff,#fffaf0);border:1px solid var(--line);border-radius:20px;width:min(780px,100%);padding:22px;display:grid;gap:13px;box-shadow:0 24px 70px rgba(90,65,10,.28);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.vr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.im{position:relative}.im img{width:84px;height:84px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.im button{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:14px;box-shadow:0 2px 8px rgba(90,65,10,.3)}
.add{width:84px;height:84px;border:1.5px dashed var(--gold);border-radius:12px;color:var(--gold);display:grid;place-items:center;font-size:12px;text-align:center;cursor:pointer;background:rgba(184,138,42,.05);transition:background .15s}.add:hover{background:rgba(184,138,42,.12)}
.chk{display:flex;gap:16px;align-items:center}.chk label{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:14px}.chk input{width:auto;accent-color:var(--gold)}
input[type=checkbox],input[type=radio]{accent-color:var(--gold)}
.pos{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
.pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.pp .it{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;transition:border-color .15s,transform .15s}
.pp .it:hover{border-color:rgba(184,138,42,.5)}
.pp .it b{display:block;margin-bottom:6px}
.pp .it button{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:5px;font-size:13px;background:rgba(184,138,42,.05)}
.pp .it button:hover:not([disabled]){border-color:var(--gold);background:rgba(184,138,42,.1)}.pp .it button[disabled]{opacity:.4}
.row{display:flex;justify-content:space-between;padding:4px 0;color:var(--mute)}.row.t{color:var(--ink);font-size:19px;font-weight:700;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1b1608;border-radius:12px;padding:11px 20px;font-weight:600;z-index:60;display:none;box-shadow:0 10px 30px rgba(90,65,10,.3);max-width:90vw;text-align:center}
.toast.er{background:var(--red);color:#fff}
.mut{color:var(--mute)}
.stat b.grn{color:var(--green)}.stat b.red,.stat .red{color:var(--red)}
.hb{margin:10px 0}.hl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.ht{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:3px}.ht i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.lg{font-size:12px;color:var(--mute);margin:-4px 0 4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:middle}.lg i:first-child{margin-left:0}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
@media(max-width:900px){
 .shell{display:block}
 .side{position:fixed;inset:auto 0 0 0;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;border-right:0;border-top:1px solid var(--line);z-index:20;background:rgba(255,252,243,.97);backdrop-filter:blur(10px)}
 .side .brand,.side .sidefoot{display:none}
 .tabs{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none;flex:1}.tabs::-webkit-scrollbar{display:none}
 .tab{flex-direction:column;gap:3px;padding:7px 11px;font-size:10.5px;min-width:68px;justify-content:center;align-items:center;text-align:center;border-radius:12px;flex:none}
 .tab svg{width:21px;height:21px}
 .tab.on{box-shadow:none}
 .tab .bd{position:absolute;top:2px;right:10px;margin:0;min-width:17px;height:17px;font-size:10px}
 .mtop{display:flex;position:sticky;top:0;z-index:15;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,252,243,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
 .mtop .brand{padding:0;flex:1;min-width:0}.mtop .brand img,.mtop .brand .lg0{width:32px;height:32px}.mtop .brand b{font-size:16px}
 main{padding:16px 14px 100px}
 h2{font-size:21px}
 .cards{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px 14px}.stat b{font-size:21px}
 .pos{grid-template-columns:1fr}.g2,.g3{grid-template-columns:1fr}.vr{grid-template-columns:1fr 1fr}
 .panel{padding:14px}
 input,textarea,select{font-size:16px}
 .bar input,.bar select{max-width:none}
 .ov{padding:0;align-items:flex-end}.modal{border-radius:22px 22px 0 0;width:100%;max-height:94vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sheet .22s ease-out}
 @keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
 .toast{bottom:92px}
}
@media(max-width:380px){.cards{grid-template-columns:1fr}}
@media print{.side,.mtop,.bar,.btn{display:none!important}.shell{display:block}main{padding:0}}

.annp{border-radius:8px;overflow:hidden;text-align:center;padding:8px 12px;font-size:13px;font-weight:600;background:linear-gradient(90deg,#c9a24b,#e6c775,#c9a24b);color:#14110a}
.annp.b{font-weight:800}.annp .t{display:inline-block}.annp.sl .t{white-space:nowrap;padding-left:100%;animation:annsl var(--d,12s) linear infinite}.annp.bl{animation:annbl 1s ease-in-out infinite}
@keyframes annsl{from{transform:translateX(0)}to{transform:translateX(-100%)}}@keyframes annbl{0%,45%{opacity:1}55%,100%{opacity:.2}}
.chk{display:flex;gap:8px;align-items:center;flex-direction:row!important}.chk input{width:auto}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');
const BOTTLE='<div class="thumb"></div>';
let D=null,tab='dash',bill=[],editing=null,oFilter='all';
function toast(m,er){const t=$('#toast');t.textContent=m;t.className='toast'+(er?' er':'');t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
async function api(path,method='GET',body){
  const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='admin/login'){D=null;showLogin();throw new Error('login')}
  if(!r.ok)throw new Error(d.error||'Error');return d;
}
function showLogin(){
  $('#app').innerHTML=`<div class="login"><form class="lbox" id="lf"><h1>Zeen's Admin</h1><span class="mut">Enter your admin password to manage the store.</span>
  <input id="un" placeholder="Employee ID (owner: leave empty)" autocomplete="username" autocapitalize="none"><input type="password" id="pw" placeholder="Password" required><div class="er" id="le"></div><button class="btn">Login</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('admin/login','POST',{username:$('#un').value,password:$('#pw').value});await load()}catch(x){$('#le').textContent=x.message}};
}
async function load(){
  try{D=await api('admin/data');}catch(e){if(e.message!=='login')showLogin();return}
  draw();
}
const can=k=>!D||!D.me||(D.me.perms||[]).includes(k);
const tabs=[['dash','Dashboard'],['sell','Sell (In-Store)'],['prod','Products'],['ord','Orders'],['req','Requests'],['hist','History'],['rev','Reviews'],['acc','Accounts'],['off','Offers'],['set','Settings'],['staff','Staff']];
function draw(){
  const pending=D.orders.filter(o=>o.status==='pending').length;
  const vis=tabs.filter(([k])=>k==='staff'?(D.me&&D.me.owner):can(k));if(!vis.some(([k])=>k===tab))tab=vis[0]?vis[0][0]:'dash';
  const pendRev=(D.reviews||[]).filter(r=>r.status==='pending').length;
  const openReq=(D.requests||[]).filter(r=>r.status==='open').length;
  const IC={dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM13 3v6h8V3zM3 21h8v-6H3z"/>',sell:'<path d="M6 6h15l-1.5 9h-12zM6 6 5 3H2M9 20a1 1 0 1 0 0 .01M18 20a1 1 0 1 0 0 .01"/>',prod:'<path d="M9 2h6v4l2 3v11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9l2-3z"/>',ord:'<path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',req:'<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',hist:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',rev:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',acc:'<path d="M3 20h18M6 20V10M12 20V4M18 20v-7"/>',off:'<path d="M20 12 12 20 3 11V3h8zM7.5 7.5h.01"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',staff:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21v-1a6 6 0 0 1 12 0v1M16 4.5a3.5 3.5 0 0 1 0 7M22 21v-1a5 5 0 0 0-4-4.9"/>'};
  const badge={ord:pending,req:openReq,rev:pendRev};
  const logo=D.settings.logo?`<img src="/api/img/${D.settings.logo}" alt="">`:`<span class="lg0">Z</span>`;
  const brand=`<div class="brand">${logo}<div><b>Zeen's Admin</b><small>${D.me&&!D.me.owner?esc(D.me.name):'Owner'}</small></div></div>`;
  $('#app').innerHTML=`<div class="shell"><aside class="side">${brand}<nav class="tabs">${vis.map(([k,v])=>`<button class="tab ${k===tab?'on':''}" data-t="${k}"><svg viewBox="0 0 24 24">${IC[k]||''}</svg><span>${v.replace(' (In-Store)','')}</span>${badge[k]?`<i class="bd">${badge[k]}</i>`:''}</button>`).join('')}</nav>
  <div class="sidefoot"><a class="btn g s" href="/" target="_blank">View Shop</a><button class="btn g s" id="lo">Logout</button></div></aside>
  <div class="content"><div class="mtop">${brand}<a class="btn g s" href="/" target="_blank" style="text-decoration:none">Shop</a><button class="btn g s" id="lo2">Logout</button></div><main id="main"></main></div></div>`;
  document.querySelectorAll('#lo,#lo2').forEach(b=>b.onclick=async()=>{await api('admin/logout','POST');D=null;showLogin()});
  document.querySelectorAll('.tab').forEach(b=>b.onclick=async()=>{tab=b.dataset.t;await load()});
  ({dash,sell,prod,ord,req,hist,rev,acc,off,set,staff}[tab])();
}
const M=h=>$('#main').innerHTML=h;
const stock=p=>p.variants.reduce((s,v)=>s+v.stock,0);
const thumb=p=>p.images[0]?`<img class="thumb" src="/api/img/${p.images[0]}">`:BOTTLE;

// ---------- dashboard ----------
function dash(){
  const live=D.orders.filter(o=>o.status!=='cancelled'),now=new Date(),td=now.toDateString();
  const sum=a=>a.reduce((s,o)=>s+o.total,0);
  const today=live.filter(o=>new Date(o.createdAt).toDateString()===td);
  const month=live.filter(o=>{const d=new Date(o.createdAt);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const low=[];D.products.forEach(p=>p.variants.forEach(v=>{if(v.stock<=3)low.push([p,v])}));
  const val=D.products.reduce((s,p)=>s+p.variants.reduce((a,v)=>a+v.stock*v.price,0),0);
  const best={};live.forEach(o=>o.lines.forEach(l=>best[l.name]=(best[l.name]||0)+l.qty));
  const top=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,5);
  M(`<h2>Dashboard</h2><div class="cards">
   <div class="stat"><span>Today's sales</span><b>${rs(sum(today))}</b><small class="mut">${today.length} orders</small></div>
   <div class="stat"><span>This month</span><b>${rs(sum(month))}</b><small class="mut">${month.length} orders</small></div>

async function unzipImgs(file){
  const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf);
  let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('Zip file sahi nahi hai');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    if(name.endsWith('/')||name.includes('__MACOSX')||!/\.(png|jpe?g|webp)$/i.test(name))continue;
    const ds=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true);let data=u8.subarray(ds,ds+csz);
    if(method===8){data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else if(method!==0)continue;
    const b=name.split('/').pop();out.push(new File([data],b,{type:/\.webp$/i.test(b)?'image/webp':/\.png$/i.test(b)?'image/png':'image/jpeg'}));
  }
  return out;
}

function resize(file,max=900,type='image/jpeg',q=.82){return new Promise((res,rej)=>{
  const im=new Image,u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type,q))};
  im.onerror=()=>rej(new Error('Image read nahi hui'));im.src=u})}

// ---------- sales history / search ----------
let H={q:'',src:'all',st:'all',pay:'all',paid:'all',from:'',to:'',view:'orders'};
function histList(){
  const q=H.q.trim().toLowerCase(),dg=q.replace(/\D/g,'');
  const f=H.from?new Date(H.from+'T00:00:00'):null,t=H.to?new Date(H.to+'T23:59:59'):null;
  return D.orders.filter(o=>{
    const d=new Date(o.createdAt);
    if(f&&d<f)return false;if(t&&d>t)return false;
    if(H.src!=='all'&&o.source!==H.src)return false;
    if(H.st!=='all'&&o.status!==H.st)return false;
    if(H.pay!=='all'&&(H.pay==='COD'?o.payment!=='COD':H.pay==='Online'?!['Bank Transfer','Easypaisa','JazzCash'].includes(o.payment)||o.source==='store':o.payment!==H.pay))return false;
    if(H.paid!=='all'){const isPaid=o.source==='store'||o.paid||(o.payment==='COD'&&o.status==='delivered');if((H.paid==='paid')!==isPaid)return false}
    if(q){const hay=(o.id+' '+o.customer.name+' '+o.customer.phone+' '+o.customer.city+' '+(o.customer.address||'')+' '+o.lines.map(l=>l.name+' '+l.size).join(' ')+' '+(o.paymentRef||'')).toLowerCase();
      if(!hay.includes(q)&&!(dg.length>=4&&String(o.customer.phone).replace(/\D/g,'').includes(dg)))return false}
    return true;
  });
}
function hist(){
  const sel=(id,v,opts)=>`<select id="${id}">${opts.map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>`;
  M(`<h2>Sales History</h2><p class="mut">Invoice number, customer ka naam/phone, ya perfume ka naam likh kar search karein. Filters se date, online/shop, status aur payment alag kar sakte hain.</p>
  <div class="panel"><div class="bar"><input id="hq" placeholder="Search: ZF-1001, customer, phone, perfume..." value="${esc(H.q)}" style="flex:1;min-width:200px"></div>
  <div class="bar">${sel('hsrc',H.src,[['all','Online + Shop'],['online','Online orders'],['store','In-store sales']])}
  ${sel('hst',H.st,[['all','Any status'],['pending','pending'],['confirmed','confirmed'],['shipped','shipped'],['delivered','delivered'],['cancelled','cancelled']])}
  ${sel('hpay',H.pay,[['all','Any payment'],['COD','Cash on Delivery'],['Online','Online (all)'],['Bank Transfer','Bank Transfer'],['Easypaisa','Easypaisa'],['JazzCash','JazzCash'],['Cash','Shop: Cash'],['Card','Shop: Card']])}
  ${sel('hpaid',H.paid,[['all','Paid + Unpaid'],['paid','Paid'],['unpaid','Unpaid']])}
  <label class="mut">From <input type="date" id="hfrom" value="${H.from}"></label><label class="mut">To <input type="date" id="hto" value="${H.to}"></label>
  <button class="btn g s" id="hclr">Clear</button></div>
  <div class="bar">${sel('hview',H.view,[['orders','View: Orders'],['cust','View: Customers (kis ne kya khareeda)']])}<button class="btn g s" id="hcsv">Download CSV</button></div></div>
  <div id="hres"></div>`);
  const upd=()=>histRes();
  const bind=(id,k)=>{$('#'+id).oninput=e=>{H[k]=e.target.value;upd()}};
  bind('hq','q');bind('hsrc','src');bind('hst','st');bind('hpay','pay');bind('hpaid','paid');bind('hfrom','from');bind('hto','to');bind('hview','view');
  $('#hclr').onclick=()=>{H={q:'',src:'all',st:'all',pay:'all',paid:'all',from:'',to:'',view:H.view};hist()};

}

  $('#hres').innerHTML=`<div class="cards"><div class="stat"><span>Records</span><b>${list.length}</b></div><div class="stat"><span>Sales (cancelled chhor kar)</span><b>${rs(tot)}</b></div><div class="stat"><span>Perfumes sold</span><b>${units}</b></div></div>`+body;

function sell(){

function drawBill(){
  const g=D.settings.globalDiscount.pct;
  const L=bill.map(b=>{const p=D.products.find(x=>x.id===b.pid),v=p.variants.find(x=>x.size===b.size);const pct=Math.max(v.discount,g);const unit=Math.round(v.price*(1-pct/100));return{...b,p,v,unit}});
  const sub=L.reduce((s,l)=>s+l.unit*l.qty,0);
  $('#bl').innerHTML=L.length?`${L.map((l,i)=>`<div class="row" style="align-items:center"><span style="color:var(--ink)">${esc(l.p.name)} ${esc(l.size)}<br><small>${rs(l.unit)}</small></span>
   <span><button class="btn g s" data-m="${i}">−</button> ${l.qty} <button class="btn g s" data-pl="${i}">+</button> <b style="color:var(--ink)">${rs(l.unit*l.qty)}</b></span></div>`).join('')}
   <div class="row"><span>Subtotal</span><span>${rs(sub)}</span></div>
   <label style="margin:6px 0">Extra discount (Rs.)<input id="bd" type="number" min="0" value="${window._bd||0}"></label>
   <div class="g2"><label>Customer name<input id="bn" placeholder="Walk-in"></label><label>Phone<input id="bp"></label></div>

// ---------- invoices / whatsapp ----------
const invUrl=o=>`/invoice?id=${encodeURIComponent(o.id)}&t=${encodeURIComponent(o.token||'')}`;
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);
  if(d.startsWith('92')&&d.length===12)return d;
  if(d.startsWith('0')&&d.length===11)return '92'+d.slice(1);
  if(d.length===10&&d.startsWith('3'))return '92'+d;
  return d}
const waOk=n=>n.length>=11&&n.length<=15;
function waOpen(phone,msg){const n=waNum(phone);if(!waOk(n)){toast('Customer ka phone number sahi nahi: '+(phone||'khali'),1);return false}
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');return true}
function waOrder(o){
  if(o.dcSet===false&&o.source!=='store')return toast('Pehle delivery charges (DC) set karein',1);
  const link=location.origin+invUrl(o),days=D.settings.deliveryDays||'7 working days';
  const items=o.lines.map(l=>`• ${l.name} ${l.size} x${l.qty} = ${rs(l.total)}`).join('\n');
  const onlinePaid=o.payment!=='COD'&&o.source!=='store'&&o.paid;
  let m=`Assalam o Alaikum ${o.customer.name||''},\nThank you for shopping with ${D.settings.shopName}!\n\nOrder: ${o.id}\n${items}\n\nSubtotal: ${rs(o.subtotal)}`;
  if(o.discount)m+=`\nDiscount: - ${rs(o.discount)}`;
  if(o.source!=='store')m+=`\nDelivery charges: ${o.delivery?rs(o.delivery):'FREE'}`;
  m+=`\nTotal: ${rs(o.total)}`;
  if(onlinePaid&&o.delivery>0)m+=`\nPaid online: ${rs(o.total-o.delivery)}\nTo pay on delivery (delivery charges): ${rs(o.delivery)}`;
  else if(o.source!=='store')m+=o.payment==='COD'?`\nPayment: Cash on Delivery`:`\nPayment: ${o.payment} (${o.paid?'received':'pending'})`;
  if(o.source!=='store')m+=`\nEstimated delivery: ${days}`;
  m+=`\n\nInvoice: ${link}`;
  waOpen(o.customer.phone,m);
}
function saleDone(o){
  $('#modal').innerHTML=`<h2>Sale complete ✓</h2><div><b>${esc(o.id)}</b> · ${rs(o.total)} · ${esc(o.payment)}</div>
  <div class="mut">Give the customer a slip or send the invoice on WhatsApp.</div>
  <div class="bar" style="margin:0"><a class="btn" style="text-decoration:none" target="_blank" href="${invUrl(o)}&slip=1&print=1">Print Slip</a>
  <a class="btn g" style="text-decoration:none" target="_blank" href="${invUrl(o)}&print=1">Print A4 Invoice</a>
  <button class="btn g" id="sdw">WhatsApp</button><button class="btn g" id="sdc">Close</button></div>`;
  $('#ov').classList.add('on');
  $('#sdw').onclick=()=>waOrder(o);$('#sdc').onclick=()=>$('#ov').classList.remove('on');
}

// ---------- accounts ----------
let ACC={p:'month',from:'',to:''};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function accRange(){
  const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let f=null,t=null;
  if(ACC.p==='today')f=t0;
  else if(ACC.p==='7d'){f=new Date(t0);f.setDate(f.getDate()-6)}
  else if(ACC.p==='30d'){f=new Date(t0);f.setDate(f.getDate()-29)}
  else if(ACC.p==='month')f=new Date(n.getFullYear(),n.getMonth(),1);
  else if(ACC.p==='year')f=new Date(n.getFullYear(),0,1);
  else if(ACC.p==='custom'){f=ACC.from?new Date(ACC.from+'T00:00:00'):null;t=ACC.to?new Date(ACC.to+'T23:59:59'):null}
  return [f,t];
}
const oRev=o=>o.subtotal-o.discount;
const oCost=o=>o.lines.reduce((a,l)=>a+(l.cost||0)*l.qty,0);
const oItemDisc=o=>o.lines.reduce((a,l)=>a+(l.orig-l.unit)*l.qty,0);
function agg(list){
  const r={n:list.length,rev:0,cost:0,itemDisc:0,extraDisc:0,units:0,delivery:0,list:0};
  for(const o of list){r.rev+=oRev(o);r.cost+=oCost(o);r.itemDisc+=oItemDisc(o);r.extraDisc+=o.discount;r.delivery+=o.delivery;
    r.units+=o.lines.reduce((a,l)=>a+l.qty,0);r.list+=o.lines.reduce((a,l)=>a+l.orig*l.qty,0)}
  r.profit=r.rev-r.cost;return r;
}
const fmtK=n=>{n=Math.round(n);const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1)+'M':a>=1e3?(n/1e3).toFixed(a>=1e4?0:1)+'k':String(n)};
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));const r=m/p;return (r<=1?1:r<=2?2:r<=4?4:r<=5?5:10)*p}
function barChart(labels,series,H=230){
  const W=640,pl=46,pb=28,pt=14,pr=8,all=series.flatMap(s=>s.values);const nice=niceMax(Math.max(1,...all));
  const iw=W-pl-pr,ih=H-pt-pb,n=labels.length,gw=iw/n,bw=Math.min(24,(gw-6)/series.length);let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".13"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".7">${fmtK(nice*i/4)}</text>`}
  labels.forEach((lb,i)=>{const x0=pl+gw*i+(gw-bw*series.length)/2;
    series.forEach((s,j)=>{const v=Math.max(0,s.values[i]),bh=ih*v/nice;g+=`<rect x="${x0+bw*j}" y="${pt+ih-bh}" width="${bw-2}" height="${bh}" rx="3" fill="${s.color}"><title>${esc(lb)} · ${esc(s.name)}: ${rs(s.values[i])}</title></rect>`});
    g+=`<text x="${pl+gw*i+gw/2}" y="${H-9}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".8">${esc(lb)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--mute)">${g}</svg>`;
}
function lineChart(labels,values,H=200){
  const W=640,pl=46,pb=26,pt=12,pr=10,nice=niceMax(Math.max(1,...values)),iw=W-pl-pr,ih=H-pt-pb,n=values.length;
  const X=i=>pl+iw*i/(n-1||1),Y=v=>pt+ih-ih*v/nice;let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".13"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".7">${fmtK(nice*i/4)}</text>`}
  const pts=values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  g+=`<polygon points="${X(0)},${pt+ih} ${pts} ${X(n-1)},${pt+ih}" fill="var(--gold)" opacity=".15"/><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round"/>`;
  values.forEach((v,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${v?3:0}" fill="var(--gold2)"><title>${esc(labels[i])}: ${rs(v)}</title></circle>`;if(i%5===0||i===n-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".8">${esc(labels[i])}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--mute)">${g}</svg>`;
}
function hbars(items,fmt=rs){
  items=items.filter(i=>i.v>0);const tot=items.reduce((a,i)=>a+i.v,0)||1,mx=Math.max(1,...items.map(i=>i.v));
  return items.length?items.map(i=>`<div class="hb"><div class="hl"><span>${esc(i.l)}</span><span>${Math.round(i.v/tot*100)}% · ${fmt(i.v)}</span></div><div class="ht"><i style="width:${i.v/mx*100}%"></i></div></div>`).join(''):'<span class="mut">No data yet.</span>';
}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const EXCAT=['Stock purchase','Packaging','Courier / Delivery','Ads / Marketing','Rent','Salary','Utilities','Other'];

  const byPay=Object.entries(L.reduce((m,o)=>{m[o.payment]=(m[o.payment]||0)+o.total;return m},{})).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v);
  const bySrc=[{l:'Online orders',v:L.filter(o=>o.source!=='store').reduce((a,o)=>a+o.total,0)},{l:'In-store sales',v:L.filter(o=>o.source==='store').reduce((a,o)=>a+o.total,0)}];
  const byCity=Object.entries(L.reduce((m,o)=>{const c=(o.customer.city||'').trim().toLowerCase();if(c)m[c]=(m[c]||0)+o.total;return m},{})).map(([l,v])=>({l:l.replace(/\b\w/g,x=>x.toUpperCase()),v})).sort((a,b)=>b.v-a.v).slice(0,8);
  // customers
  const cm={};live.forEach(o=>{const k=String(o.customer.phone||'').replace(/\D/g,'');if(!k)return;const c=cm[k]=cm[k]||{name:o.customer.name,phone:o.customer.phone,n:0,spent:0,last:o.createdAt};c.n++;c.spent+=o.total;if(o.createdAt>c.last){c.last=o.createdAt;c.name=o.customer.name}});
  const cust=Object.values(cm).sort((a,b)=>b.spent-a.spent),repeat=cust.filter(c=>c.n>1).length;
  // stock value

   ${ACC.p==='custom'?`<input type="date" id="af" value="${ACC.from}" style="min-width:0"><input type="date" id="at" value="${ACC.to}" style="min-width:0">`:''}

   ${kpi('Sales (after discount)',rs(A.rev),`${A.n} orders · ${A.units} perfumes`)}

   <div class="mut" style="margin-top:8px;font-size:12px">Without any discount your sales would have been ${rs(A.list)}.</div>
   <h2 style="font-size:20px;margin-top:16px">Stock value (right now)</h2><div class="row"><span>Perfumes in stock</span><span>${sUnits}</span></div><div class="row"><span>Value at cost</span><span>${rs(sCost)}</span></div><div class="row"><span>Value at selling price</span><span>${rs(sRetail)}</span></div><div class="row t"><span>Possible profit</span><span>${rs(sRetail-sCost)}</span></div></div></div>
  <div class="panel"><h2 style="font-size:20px">Top customers</h2><div class="mut" style="margin-bottom:6px">${cust.length} customers · ${repeat} came back again</div>${cust.length?`<table><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Total spent</th><th>Last order</th></tr></thead><tbody>${cust.slice(0,10).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.n}</td><td>${rs(c.spent)}</td><td>${new Date(c.last).toLocaleDateString('en-GB')}</td></tr>`).join('')}</tbody></table>`:'<span class="mut">No customers yet.</span>'}</div>
  <div class="panel"><h2 style="font-size:20px">Expenses</h2><div class="mut" style="margin-bottom:8px">Rent, courier, packaging, ads... add them here so net profit is real.</div>
   <div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px"><label>Date<input type="date" id="xd" value="${ymd(new Date())}"></label><label>Category<select id="xc">${EXCAT.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Note<input id="xn" placeholder="optional"></label><label>Amount (Rs.)<input id="xa" type="number" min="1"></label><label>&nbsp;<button class="btn" id="xadd">Add</button></label></div>
   ${exR.length?`<table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr></thead><tbody>${exR.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.note)}</td><td>${rs(e.amount)}</td><td><button class="btn r s" data-xd="${e.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:'<span class="mut">No expenses in this period.</span>'}</div>`);
  $('#main').onclick=async e=>{
    const p=e.target.closest('[data-p]');if(p){ACC.p=p.dataset.p;return acc()}
    if(e.target.id==='csv')return csvOut(L);
    const xd=e.target.closest('[data-xd]');if(xd&&confirm('Delete this expense?')){await api('admin/expense/'+xd.dataset.xd,'DELETE');await load();return}
    if(e.target.id==='xadd'){try{await api('admin/expense','POST',{date:$('#xd').value,category:$('#xc').value,note:$('#xn').value,amount:+$('#xa').value});toast('Expense added');await load()}catch(x){toast(x.message,1)}}
  };
  $('#main').onchange=e=>{if(e.target.id==='af'){ACC.from=e.target.value;acc()}if(e.target.id==='at'){ACC.to=e.target.value;acc()}};
}
function csvOut(list){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Order','Date','Type','Status','Customer','Phone','City','Items','Sales','Discount','Delivery','Total','Cost','Profit','Payment']];
  list.forEach(o=>rows.push([o.id,new Date(o.createdAt).toLocaleString('en-GB'),o.source,o.status,o.customer.name,o.customer.phone,o.customer.city,o.lines.map(l=>l.name+' '+l.size+' x'+l.qty).join('; '),o.subtotal,oItemDisc(o)+o.discount,o.delivery,o.total,oCost(o),oRev(o)-oCost(o),o.payment]));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zeen-sales-'+ymd(new Date())+'.csv';a.click();
}

// ---------- design (colors, logo, hero image) ----------
const PRESETS={
 'Green & Gold':{bg:'#0d2019',card:'#163226',accent:'#c9a24b',ink:'#f4efe3'},
 'Purple-Navy & Gold':{bg:'#120f2b',card:'#221d52',accent:'#d4af5a',ink:'#f6f1e6'},
 'Black & Gold':{bg:'#0b0b0c',card:'#1b1b1e',accent:'#c9a24b',ink:'#f5f1e8'},
 'Rose & Gold':{bg:'#2a1418',card:'#3d1f26',accent:'#d9a58a',ink:'#fbeee8'},
 'Cream & Gold (light)':{bg:'#faf6ee',card:'#fffdf8',accent:'#a67c1a',ink:'#2b2417'}};
let dsn=null;
function designHtml(){
  const s=D.settings;dsn={theme:{...s.theme},logo:s.logo||'',heroImage:s.heroImage||''};
  const cf=(k,l)=>`<label>${l}<input type="color" data-ck="${k}" value="${dsn.theme[k]}" style="height:44px;padding:3px"></label>`;
  return `<div class="panel" id="design" style="display:grid;gap:14px"><h2 style="font-size:20px;margin:0">Website Design</h2>
  <div><div class="mut" style="margin-bottom:6px">Quick styles (tap one, then Save Design)</div><div class="bar" style="margin:0" id="presets">${Object.keys(PRESETS).map(n=>`<button class="btn g s" data-pr="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>
  <div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${cf('bg','Background')}${cf('card','Cards / boxes')}${cf('accent','Gold / buttons')}${cf('ink','Text')}</div>
  <div id="pv"></div>
  <div class="g2"><div><div class="mut" style="margin-bottom:6px">Logo (PNG with transparent background is best)</div><div id="dlogo"></div></div>
  <div><div class="mut" style="margin-bottom:6px">Home page main picture (optional, replaces the bottle drawing)</div><div id="dhero"></div></div></div>
  <div><button class="btn" id="sd">Save Design</button></div></div>`;
}
function designInit(){
  const draw=()=>{
    const t=dsn.theme;
    $('#pv').innerHTML=`<div style="background:${t.bg};border:1px solid ${t.accent}55;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      ${dsn.logo?`<img src="/api/img/${dsn.logo}" style="width:54px;height:54px;object-fit:contain;border-radius:50%">`:`<div style="width:54px;height:54px;border-radius:50%;border:1.5px solid ${t.accent};color:${t.accent};display:grid;place-items:center;font:600 28px Georgia,serif">Z</div>`}
      <div style="flex:1;min-width:150px"><div style="font:600 24px Georgia,serif;color:${t.accent}">Zeen's Fragrance</div><div style="color:${t.ink};opacity:.75;font-size:13px">Preview of your website colors</div></div>
      <div style="background:${t.card};color:${t.ink};border:1px solid ${t.accent}66;border-radius:10px;padding:10px 14px;font-size:13px">Product card</div>
      <div style="background:${t.accent};color:${t.bg};border-radius:999px;padding:9px 18px;font-weight:600;font-size:13px">Shop Now</div></div>`;
    document.querySelectorAll('[data-ck]').forEach(i=>i.value=dsn.theme[i.dataset.ck]);
    const box=(k,id,lbl)=>{$(id).innerHTML=(dsn[k]?`<div class="im" style="display:inline-block"><img src="/api/img/${dsn[k]}" style="width:${k==='logo'?96:140}px;height:96px;object-fit:${k==='logo'?'contain':'cover'};background:#8883"><button data-rm="${k}">×</button></div>`:`<label class="add" style="width:${k==='logo'?96:140}px;height:96px">+ ${lbl}<input type="file" accept="image/*" data-up="${k}" hidden></label>`)};
    box('logo','#dlogo','Upload logo');box('heroImage','#dhero','Upload picture');
  };
  draw();
  const d=$('#design');
  d.oninput=e=>{const k=e.target.dataset.ck;if(k){dsn.theme[k]=e.target.value;draw()}};
  d.onclick=async e=>{
    const p=e.target.closest('[data-pr]');if(p){Object.assign(dsn.theme,PRESETS[p.dataset.pr]);return draw()}
    const r=e.target.closest('[data-rm]');if(r){dsn[r.dataset.rm]='';return draw()}
    if(e.target.id==='sd'){try{await api('admin/settings','POST',{...D.settings,theme:dsn.theme,logo:dsn.logo,heroImage:dsn.heroImage});toast('Design saved. Open the shop to see it.');await load()}catch(x){toast(x.message,1)}}
  };
  d.onchange=async e=>{const k=e.target.dataset.up;if(!k)return;const f=e.target.files[0];if(!f)return;
    try{const logo=k==='logo';const dataUrl=await resize(f,logo?480:1200,logo?'image/webp':'image/jpeg',logo?.92:.8);
      const r=await api('admin/image','POST',{dataUrl});dsn[k]=r.id;draw()}catch(x){toast(x.message,1)}};
}

// ---------- payment methods ----------
function payHtml(){
  const P=D.settings.payments||{},b=P.bank||{},e=P.easypaisa||{},j=P.jazzcash||{};
  const chk=(id,v,l)=>`<label style="display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px"><input type="checkbox" id="${id}" ${v?'checked':''} style="width:auto">${l}</label>`;
  const inp=(id,l,v)=>`<label>${l}<input id="${id}" value="${esc(v||'')}"></label>`;
  return `<div class="panel" id="paybox" style="display:grid;gap:14px"><h2 style="font-size:20px;margin:0">Payment Methods & Account Numbers</h2>
  <div class="mut">Customers pick <b>COD</b> or <b>Online</b> at checkout. The account details you enter here are shown to them. A method is switched on only when its number is filled.</div>
  ${chk('pay_cod',P.cod?P.cod.enabled!==false:true,'Cash on Delivery (COD)')}
  <div class="panel" style="margin:0;display:grid;gap:10px"><b>Bank Account</b>${chk('pay_bank_on',b.enabled,'Show to customers')}<div class="g3">${inp('pay_bank_name','Bank name',b.bankName)}${inp('pay_bank_title','Account title',b.title)}${inp('pay_bank_num','Account number / IBAN',b.number)}</div></div>
  <div class="panel" style="margin:0;display:grid;gap:10px"><b>Easypaisa</b>${chk('pay_ep_on',e.enabled,'Show to customers')}<div class="g2">${inp('pay_ep_title','Account title',e.title)}${inp('pay_ep_num','Easypaisa number',e.number)}</div></div>
  <div class="panel" style="margin:0;display:grid;gap:10px"><b>JazzCash</b>${chk('pay_jc_on',j.enabled,'Show to customers')}<div class="g2">${inp('pay_jc_title','Account title',j.title)}${inp('pay_jc_num','JazzCash number',j.number)}</div></div>
  <div><button class="btn" id="paysave">Save Payment Settings</button></div></div>`;
}
function payInit(){
  $('#paysave').onclick=async()=>{const g=id=>$('#'+id).value;
    const payments={cod:{enabled:$('#pay_cod').checked},
      bank:{enabled:$('#pay_bank_on').checked,bankName:g('pay_bank_name'),title:g('pay_bank_title'),number:g('pay_bank_num')},
      easypaisa:{enabled:$('#pay_ep_on').checked,title:g('pay_ep_title'),number:g('pay_ep_num')},
      jazzcash:{enabled:$('#pay_jc_on').checked,title:g('pay_jc_title'),number:g('pay_jc_num')}};
    try{await api('admin/settings','POST',{...D.settings,payments});toast('Payment settings saved');await load()}catch(x){toast(x.message,1)}};
}

// ---------- settings ----------
function annInit(){
  const pv=()=>{const t=($('#s_announcement').value||'').trim(),ef=$('#s_annEffect').value,sl=ef==='slide'||ef==='slideblink',bl=ef==='blink'||ef==='slideblink',def=$('#s_annDef').checked;
    const k={slow:1.7,normal:1,fast:.55}[$('#s_annSpeed').value]||1,a=$('#annPrev');
    a.className='annp'+($('#s_annBold').checked?' b':'')+(sl?' sl':'')+(bl?' bl':'');a.style.setProperty('--d',Math.round((8+t.length*.22)*k*.6)+'s');
    a.style.color=def?'':$('#s_annColor').value;a.style.background=def?'':$('#s_annBg').value;$('#annCols').style.opacity=def?.4:1;
    a.innerHTML='<span class="t"></span>';a.firstChild.textContent=t||'(announcement yahan dikhegi)'};
  ['s_announcement','s_annEffect','s_annSpeed','s_annBold','s_annDef','s_annColor','s_annBg'].forEach(i=>{$('#'+i).oninput=pv;$('#'+i).onchange=pv});
  $('#annRed').onclick=()=>{$('#s_annDef').checked=false;$('#s_annColor').value='#ffffff';$('#s_annBg').value='#d11a2a';$('#s_annBold').checked=true;if($('#s_annEffect').value==='static')$('#s_annEffect').value='slideblink';pv()};
  pv();
}
function backup(){
  const j=JSON.stringify({exportedAt:new Date().toISOString(),note:'Images are not included in this backup.',settings:D.settings,products:D.products,orders:D.orders,coupons:D.coupons,expenses:D.expenses,requests:D.requests,reviews:D.reviews,staff:D.staff},null,1);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download='zeen-backup-'+ymd(new Date())+'.json';a.click();
}
function set(){
  const s=D.settings;
  const f=(id,l,v,t='text')=>`<label>${l}<input id="s_${id}" type="${t}" value="${esc(v)}"></label>`;
  M(`<h2>Settings</h2>${designHtml()}${payHtml()}<div class="panel" style="display:grid;gap:12px">
  <div class="g2">${f('shopName','Shop name',s.shopName)}${f('tagline','Tagline',s.tagline)}</div>
  <div class="g2">${f('heroTitle','Homepage heading',s.heroTitle)}${f('heroSub','Homepage sub-heading',s.heroSub)}</div>
  <div class="panel" style="display:grid;gap:10px;background:transparent"><b>Top announcement bar</b><span class="mut">Text likhein (khali = bar nazar nahi aayegi). Jab chahein badal sakte hain, phir Save Settings dabayein.</span>
   ${f('announcement','Announcement text (e.g. Eid Sale: 20% OFF on all perfumes!)',s.announcement)}
   <div class="g2"><label>Effect<select id="s_annEffect">${[['static','Normal (still)'],['slide','Slide (scrolling)'],['blink','Blink'],['slideblink','Slide + Blink']].map(([k,l])=>`<option value="${k}" ${(s.annEffect||'static')===k?'selected':''}>${l}</option>`).join('')}</select></label>
   <label>Speed (slide)<select id="s_annSpeed">${[['slow','Slow'],['normal','Normal'],['fast','Fast']].map(([k,l])=>`<option value="${k}" ${(s.annSpeed||'normal')===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
   <label class="chk"><input type="checkbox" id="s_annBold" ${s.annBold?'checked':''}> Bold text</label>
   <label class="chk"><input type="checkbox" id="s_annDef" ${!s.annColor&&!s.annBg?'checked':''}> Website ke gold colors use karein</label>
   <div class="g2" id="annCols"><label>Text color<input type="color" id="s_annColor" value="${s.annColor||'#ffffff'}"></label><label>Background color<input type="color" id="s_annBg" value="${s.annBg||'#b3202a'}"></label></div>
   <div class="bar" style="margin:0"><button type="button" class="btn g s" id="annRed">Offer style: Red + Bold</button></div>
   <div><span class="mut">Preview</span><div class="annp" id="annPrev"></div></div></div>
  <div class="g2">${f('whatsapp','WhatsApp number (with country code, e.g. 923001234567)',s.whatsapp)}${f('phone','Phone (shown in footer)',s.phone)}</div>
  <div class="g2">${f('address','Address (footer)',s.address)}${f('instagram','Instagram link or username (icon in footer)',s.instagram)}</div>
  <div class="g2">${f('facebook','Facebook page link or name (icon in footer)',s.facebook)}<label>Delivery charges<select id="s_deliveryMode"><option value="note" ${s.deliveryMode!=='fixed'?'selected':''}>Do not add. Only show the message below</option><option value="fixed" ${s.deliveryMode==='fixed'?'selected':''}>Add a fixed amount to the total</option></select></label></div>
  ${f('deliveryDays','Estimated delivery time shown to customers (e.g. 7 working days)',s.deliveryDays||'7 working days')}
  ${f('deliveryNote','Delivery message shown to customers (cart, checkout, invoice)',s.deliveryNote)}
  <div class="g2">${f('deliveryCharge','Fixed delivery charge (Rs.) only for the Fixed option',s.deliveryCharge,'number')}${f('freeDeliveryAbove','Free delivery above (Rs., 0 = never) only for Fixed',s.freeDeliveryAbove,'number')}</div>
  ${f('invoiceNote','Thank-you note on invoice / slip',s.invoiceNote)}
  ${f('invoiceTerms','Terms on invoice (optional, e.g. return policy)',s.invoiceTerms)}
  <div><button class="btn" id="ss">Save Settings</button></div></div>
  ${D.me&&D.me.owner?`<div class="panel"><h2 style="font-size:20px">Backup</h2><p class="mut">Poora data (orders, products, customers, reviews) ek file mein. Mahine mein ek baar download kar ke rakhein.</p><button class="btn g" id="bk">Download full backup (JSON)</button></div>`:''}`);
  if($('#bk'))$('#bk').onclick=backup;
  designInit();payInit();annInit();$('#ss').onclick=async()=>{const g=id=>$('#s_'+id).value;
    await api('admin/settings','POST',{shopName:g('shopName'),tagline:g('tagline'),heroTitle:g('heroTitle'),heroSub:g('heroSub'),announcement:g('announcement'),annEffect:g('annEffect'),annSpeed:g('annSpeed'),annBold:$('#s_annBold').checked,annColor:$('#s_annDef').checked?'':g('annColor'),annBg:$('#s_annDef').checked?'':g('annBg'),whatsapp:g('whatsapp'),phone:g('phone'),address:g('address'),instagram:g('instagram'),facebook:g('facebook'),deliveryMode:$('#s_deliveryMode').value,deliveryNote:g('deliveryNote'),deliveryDays:g('deliveryDays'),deliveryCharge:+g('deliveryCharge'),freeDeliveryAbove:+g('freeDeliveryAbove'),invoiceNote:g('invoiceNote'),invoiceTerms:g('invoiceTerms'),globalDiscount:D.settings.globalDiscount});
    toast('Saved');await load()};
}
load();
</script>
