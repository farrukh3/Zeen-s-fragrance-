<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Zeen's Fragrance</title>
<style>
:root{--bg:#0d2019;--bg2:#12291f;--card:#163226;--line:#27493a;--gold:#c9a24b;--gold2:#e4c77c;--ink:#f4efe3;--mute:#a9b8ad;--red:#e0654f;--green:#7fd69c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:-1px}
label{display:grid;gap:4px;color:var(--mute);font-size:12px}
.btn{background:var(--gold);color:#1b1b12;font-weight:600;border-radius:8px;padding:9px 16px}
.btn:hover{background:var(--gold2)}.btn.g{background:none;border:1px solid var(--line);color:var(--ink)}.btn.r{background:none;border:1px solid var(--red);color:var(--red)}
.btn.s{padding:5px 10px;font-size:13px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px;width:min(380px,100%);display:grid;gap:14px}
.lbox h1{font:600 30px Georgia,serif;color:var(--gold2)}
.er{color:var(--red);font-size:13px;min-height:18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:10;gap:10px;flex-wrap:wrap}
.top b{font:600 22px Georgia,serif;color:var(--gold2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:8px;color:var(--mute)}.tab.on{background:var(--gold);color:#1b1b12;font-weight:600}
main{padding:18px;max-width:1200px;margin:0 auto}
h2{font:600 26px Georgia,serif;color:var(--gold2);margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:1px}.stat b{display:block;font-size:24px;color:var(--gold2);margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:1px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#0f261c;display:block}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;border:1px solid var(--line)}
.pill.pending{color:#f1c40f;border-color:#f1c40f}.pill.confirmed,.pill.shipped{color:#6cb6ff;border-color:#6cb6ff}.pill.delivered{color:var(--green);border-color:var(--green)}.pill.cancelled{color:var(--red);border-color:var(--red)}
.low{color:var(--red);font-weight:600}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{width:auto;min-width:160px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.ov.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);padding:20px;display:grid;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.vr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.im{position:relative}.im img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}
.im button{position:absolute;top:-6px;right:-6px;background:var(--red);border-radius:50%;width:20px;height:20px;line-height:20px;font-size:14px}
.add{width:84px;height:84px;border:1px dashed var(--gold);border-radius:8px;color:var(--gold2);display:grid;place-items:center;font-size:12px;text-align:center;cursor:pointer}
.chk{display:flex;gap:16px;align-items:center}.chk label{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px}.chk input{width:auto}
.pos{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.pp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pp .it{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px}
.pp .it b{display:block;margin-bottom:6px}
.pp .it button{display:block;width:100%;text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-top:4px;font-size:13px}
.pp .it button:hover:not([disabled]){border-color:var(--gold)}.pp .it button[disabled]{opacity:.4}
.row{display:flex;justify-content:space-between;padding:3px 0;color:var(--mute)}.row.t{color:var(--ink);font-size:18px;font-weight:600}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1b1b12;border-radius:10px;padding:10px 18px;font-weight:600;z-index:60;display:none}
.toast.er{background:var(--red);color:#fff}
.mut{color:var(--mute)}
.stat b.grn{color:var(--green)}.stat b.red,.stat .red{color:var(--red)}
.hb{margin:8px 0}.hl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.ht{height:7px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:3px}.ht i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.lg{font-size:12px;color:var(--mute);margin:-4px 0 4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:middle}.lg i:first-child{margin-left:0}
@media(max-width:760px){.pos{grid-template-columns:1fr}.g2,.g3{grid-template-columns:1fr}.vr{grid-template-columns:1fr 1fr}}
@media print{.top,.tabs,.bar,.btn{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');
const BOTTLE='<div class="thumb"></div>';
let D=null,tab='dash',bill=[],editing=null,oFilter='all';
function toast(m,er){const t=$('#toast');t.textContent=m;t.className='toast'+(er?' er':'');t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
async function api(path,method='GET',body){
  const r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&path!=='admin/login'){D=null;showLogin();throw new Error('login')}
  if(!r.ok)throw new Error(d.error||'Error');return d;
}
function showLogin(){
  $('#app').innerHTML=`<div class="login"><form class="lbox" id="lf"><h1>Zeen's Admin</h1><span class="mut">Enter your admin password to manage the store.</span>
  <input type="password" id="pw" placeholder="Password" autofocus required><div class="er" id="le"></div><button class="btn">Login</button></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('admin/login','POST',{password:$('#pw').value});await load()}catch(x){$('#le').textContent=x.message}};
}
async function load(){
  try{D=await api('admin/data');}catch(e){if(e.message!=='login')showLogin();return}
  draw();
}
const tabs=[['dash','Dashboard'],['sell','Sell (In-Store)'],['prod','Products'],['ord','Orders'],['acc','Accounts'],['off','Offers'],['set','Settings']];
function draw(){
  const pending=D.orders.filter(o=>o.status==='pending').length;
  $('#app').innerHTML=`<div class="top"><span>${D.settings.logo?`<img src="/api/img/${D.settings.logo}" style="height:34px;width:34px;object-fit:contain;border-radius:50%;vertical-align:middle;margin-right:8px">`:''}<b>Zeen's Admin</b></span><div class="tabs">${tabs.map(([k,v])=>`<button class="tab ${k===tab?'on':''}" data-t="${k}">${v}${k==='ord'&&pending?` (${pending})`:''}</button>`).join('')}</div>
  <span><a class="btn g s" href="/" target="_blank" style="text-decoration:none;display:inline-block">View Shop</a> <button class="btn g s" id="lo">Logout</button></span></div><main id="main"></main>`;
  $('#lo').onclick=async()=>{await api('admin/logout','POST');D=null;showLogin()};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  ({dash,sell,prod,ord,acc,off,set}[tab])();
}
const M=h=>$('#main').innerHTML=h;
const stock=p=>p.variants.reduce((s,v)=>s+v.stock,0);
const thumb=p=>p.images[0]?`<img class="thumb" src="/api/img/${p.images[0]}">`:BOTTLE;

// ---------- dashboard ----------
function dash(){
  const live=D.orders.filter(o=>o.status!=='cancelled'),now=new Date(),td=now.toDateString();
  const sum=a=>a.reduce((s,o)=>s+o.total,0);
  const today=live.filter(o=>new Date(o.createdAt).toDateString()===td);
  const month=live.filter(o=>{const d=new Date(o.createdAt);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const low=[];D.products.forEach(p=>p.variants.forEach(v=>{if(v.stock<=3)low.push([p,v])}));
  const val=D.products.reduce((s,p)=>s+p.variants.reduce((a,v)=>a+v.stock*v.price,0),0);
  const best={};live.forEach(o=>o.lines.forEach(l=>best[l.name]=(best[l.name]||0)+l.qty));
  const top=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,5);
  M(`<h2>Dashboard</h2><div class="cards">
   <div class="stat"><span>Today's sales</span><b>${rs(sum(today))}</b><small class="mut">${today.length} orders</small></div>
   <div class="stat"><span>This month</span><b>${rs(sum(month))}</b><small class="mut">${month.length} orders</small></div>
   <div class="stat"><span>Total sales</span><b>${rs(sum(live))}</b><small class="mut">${live.length} orders</small></div>
   <div class="stat"><span>Pending orders</span><b>${D.orders.filter(o=>o.status==='pending').length}</b></div>
   <div class="stat"><span>Stock (units)</span><b>${D.products.reduce((s,p)=>s+stock(p),0)}</b><small class="mut">Value ${rs(val)}</small></div></div>
   <div class="g2"><div class="panel"><h2 style="font-size:20px">Low / out of stock</h2>${low.length?`<table><tbody>${low.map(([p,v])=>`<tr><td>${esc(p.name)} ${esc(v.size)}</td><td class="low">${v.stock} left</td></tr>`).join('')}</tbody></table>`:'<span class="mut">All good.</span>'}</div>
   <div class="panel"><h2 style="font-size:20px">Best sellers</h2>${top.length?`<table><tbody>${top.map(([n,q])=>`<tr><td>${esc(n)}</td><td>${q} sold</td></tr>`).join('')}</tbody></table>`:'<span class="mut">No sales yet.</span>'}</div></div>
   <div class="panel"><h2 style="font-size:20px">Recent orders</h2>${ordTable(D.orders.slice(0,6),false)}</div>`);
}

// ---------- products ----------
function prod(){
  M(`<h2>Products</h2><div class="bar"><button class="btn" id="np">+ Add Product</button><input id="ps" placeholder="Search..."></div>
  <div class="panel"><table><thead><tr><th></th><th>Name</th><th>Category</th><th>Sizes / price / stock</th><th>Status</th><th></th></tr></thead><tbody id="pt"></tbody></table></div>`);
  const fill=()=>{const q=$('#ps').value.toLowerCase();$('#pt').innerHTML=D.products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<tr><td>${thumb(p)}</td><td><b>${esc(p.name)}</b>${p.featured?' ★':''}</td><td>${esc(p.category)}</td>
   <td>${p.variants.map(v=>`${esc(v.size)}: ${rs(v.price)}${v.discount?` (-${v.discount}%)`:''} · <span class="${v.stock<=3?'low':''}">stock ${v.stock}</span>`).join('<br>')}</td>
   <td><span class="pill ${p.active?'delivered':'cancelled'}">${p.active?'Visible':'Hidden'}</span></td>
   <td style="white-space:nowrap"><button class="btn g s" data-e="${p.id}">Edit</button> <button class="btn r s" data-d="${p.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan=6 class="mut">No products.</td></tr>'};
  fill();$('#ps').oninput=fill;$('#np').onclick=()=>pform(null);
  $('#pt').onclick=async e=>{
    const ed=e.target.closest('[data-e]');if(ed)return pform(D.products.find(p=>p.id===ed.dataset.e));
    const dl=e.target.closest('[data-d]');if(dl&&confirm('Delete this product permanently?')){await api('admin/product/'+dl.dataset.d,'DELETE');toast('Deleted');await load()}
  };
}
function pform(p){
  editing=p?JSON.parse(JSON.stringify(p)):{name:'',brand:"Zeen's Fragrance",category:'men',description:'',notes:{top:[],heart:[],base:[]},images:[],badge:'',featured:false,active:true,variants:[{size:'50ml',price:1500,cost:0,discount:0,stock:0},{size:'30ml',price:1000,cost:0,discount:0,stock:0}]};
  const e=editing;
  $('#modal').innerHTML=`<h2>${p?'Edit':'Add'} Product</h2>
  <div class="g2"><label>Name *<input id="f_name" value="${esc(e.name)}"></label><label>Brand<input id="f_brand" value="${esc(e.brand)}"></label></div>
  <div class="g3"><label>Category<select id="f_cat">${['men','women','unisex'].map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></label>
   <label>Badge (e.g. New, Best Seller)<input id="f_badge" value="${esc(e.badge)}"></label>
   <div class="chk" style="padding-top:18px"><label><input type="checkbox" id="f_feat" ${e.featured?'checked':''}>Featured</label><label><input type="checkbox" id="f_act" ${e.active?'checked':''}>Visible on shop</label></div></div>
  <label>Description<textarea id="f_desc" rows="3">${esc(e.description)}</textarea></label>
  <div class="g3"><label>Top notes (comma separated)<input id="f_top" value="${esc(e.notes.top.join(', '))}"></label><label>Heart notes<input id="f_heart" value="${esc(e.notes.heart.join(', '))}"></label><label>Base notes<input id="f_base" value="${esc(e.notes.base.join(', '))}"></label></div>
  <div><div class="mut" style="margin-bottom:6px;font-size:12px">Photos (first photo is the main one, max 4)</div><div class="imgs" id="f_imgs"></div></div>
  <div><div class="mut" style="margin-bottom:6px;font-size:12px">Sizes — selling price, your cost price (for profit), discount % and stock</div><div id="f_vars" style="display:grid;gap:8px"></div><button class="btn g s" id="addv" style="margin-top:8px">+ Add size</button></div>
  <div class="er" id="f_er"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn g" id="cancel">Cancel</button><button class="btn" id="save">Save Product</button></div>`;
  drawImgs();drawVars();$('#ov').classList.add('on');
  $('#cancel').onclick=()=>$('#ov').classList.remove('on');
  $('#addv').onclick=()=>{readVars();e.variants.push({size:'',price:0,cost:0,discount:0,stock:0});drawVars()};
  $('#save').onclick=async()=>{
    readVars();
    const body={id:e.id,name:$('#f_name').value,brand:$('#f_brand').value,category:$('#f_cat').value,badge:$('#f_badge').value,featured:$('#f_feat').checked,active:$('#f_act').checked,
      description:$('#f_desc').value,notes:{top:$('#f_top').value,heart:$('#f_heart').value,base:$('#f_base').value},images:e.images,variants:e.variants};
    try{await api('admin/product','POST',body);$('#ov').classList.remove('on');toast('Saved');await load()}catch(x){$('#f_er').textContent=x.message}
  };
}
function readVars(){editing.variants=[...document.querySelectorAll('.vr')].map(r=>({size:r.querySelector('.s').value,price:+r.querySelector('.p').value,cost:+r.querySelector('.c').value,discount:+r.querySelector('.d').value,stock:+r.querySelector('.k').value}))}
function drawVars(){
  $('#f_vars').innerHTML=editing.variants.map((v,i)=>`<div class="vr"><label>Size<input class="s" value="${esc(v.size)}" placeholder="50ml"></label><label>Price (Rs.)<input class="p" type="number" min="0" value="${v.price}"></label><label>Cost (Rs.)<input class="c" type="number" min="0" value="${v.cost||0}"></label><label>Discount %<input class="d" type="number" min="0" max="95" value="${v.discount}"></label><label>Stock<input class="k" type="number" min="0" value="${v.stock}"></label><button class="btn r s" data-rv="${i}">✕</button></div>`).join('');
  $('#f_vars').onclick=e=>{const b=e.target.closest('[data-rv]');if(b){readVars();editing.variants.splice(+b.dataset.rv,1);drawVars()}};
}
function drawImgs(){
  $('#f_imgs').innerHTML=editing.images.map((m,i)=>`<div class="im"><img src="/api/img/${m}"><button data-ri="${i}">×</button></div>`).join('')+(editing.images.length<4?`<label class="add">+ Add photo<input type="file" accept="image/*" id="f_file" hidden></label>`:'');
  $('#f_imgs').onclick=e=>{const b=e.target.closest('[data-ri]');if(b){editing.images.splice(+b.dataset.ri,1);drawImgs()}};
  const f=$('#f_file');if(f)f.onchange=async()=>{
    const file=f.files[0];if(!file)return;
    try{const dataUrl=await resize(file);const r=await api('admin/image','POST',{dataUrl});editing.images.push(r.id);drawImgs()}catch(x){toast(x.message,1)}
  };
}
function resize(file,max=900,type='image/jpeg',q=.82){return new Promise((res,rej)=>{
  const im=new Image,u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type,q))};
  im.onerror=()=>rej(new Error('Image read nahi hui'));im.src=u})}

// ---------- orders ----------
function ordTable(list,ctl=true){
  if(!list.length)return '<span class="mut">No orders yet.</span>';
  return `<table><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Invoice</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${esc(o.id)}</b><br><span class="pill">${o.source==='store'?'In-store':'Online'}</span></td>
   <td>${new Date(o.createdAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td>
   <td>${esc(o.customer.name)}<br><span class="mut">${esc(o.customer.phone)}</span>${o.customer.address?`<br><span class="mut">${esc(o.customer.address)}, ${esc(o.customer.city)}</span>`:''}${o.customer.note?`<br><i class="mut">${esc(o.customer.note)}</i>`:''}</td>
   <td>${o.lines.map(l=>`${esc(l.name)} ${esc(l.size)} ×${l.qty}`).join('<br>')}</td>
   <td>${rs(o.total)}<br><span class="mut">${esc(o.payment)}${o.coupon?' · '+esc(o.coupon):''}</span></td>
   <td>${ctl&&o.status!=='cancelled'?`<select data-o="${o.id}">${['pending','confirmed','shipped','delivered','cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>`:`<span class="pill ${o.status}">${o.status}</span>`}</td><td style="white-space:nowrap"><a class="btn g s" style="text-decoration:none;display:inline-block" target="_blank" href="${invUrl(o)}">Invoice</a> <a class="btn g s" style="text-decoration:none;display:inline-block" target="_blank" href="${invUrl(o)}&slip=1">Slip</a> <button class="btn g s" data-wa="${o.id}">WhatsApp</button></td></tr>`).join('')}</tbody></table>`;
}
function ord(){
  const list=D.orders.filter(o=>oFilter==='all'||o.status===oFilter);
  M(`<h2>Orders</h2><div class="bar"><select id="of">${['all','pending','confirmed','shipped','delivered','cancelled'].map(s=>`<option ${oFilter===s?'selected':''}>${s}</option>`).join('')}</select><span class="mut">Cancelling an order puts its stock back automatically.</span></div><div class="panel">${ordTable(list)}</div>`);
  $('#of').onchange=e=>{oFilter=e.target.value;ord()};
  $('#main').onclick=e=>{const w=e.target.closest('[data-wa]');if(w)waOrder(D.orders.find(x=>x.id===w.dataset.wa))};
  $('#main').onchange=async e=>{const s=e.target.closest('[data-o]');if(!s)return;
    if(s.value==='cancelled'&&!confirm('Cancel this order and return stock?')){return ord()}
    try{await api('admin/order/'+s.dataset.o,'POST',{status:s.value});toast('Updated');await load()}catch(x){toast(x.message,1)}};
}

// ---------- in-store sell ----------
function sell(){
  M(`<h2>Sell (In-Store)</h2><div class="pos"><div><div class="bar"><input id="sq" placeholder="Search perfume..." style="width:100%"></div><div class="pp" id="pp"></div></div>
  <div class="panel" style="align-self:start"><h2 style="font-size:20px">Bill</h2><div id="bl"></div></div></div>`);

  drawBill();
}
function drawBill(){
  const g=D.settings.globalDiscount.pct;
  const L=bill.map(b=>{const p=D.products.find(x=>x.id===b.pid),v=p.variants.find(x=>x.size===b.size);const pct=Math.max(v.discount,g);const unit=Math.round(v.price*(1-pct/100));return{...b,p,v,unit}});
  const sub=L.reduce((s,l)=>s+l.unit*l.qty,0);
  $('#bl').innerHTML=L.length?`${L.map((l,i)=>`<div class="row" style="align-items:center"><span style="color:var(--ink)">${esc(l.p.name)} ${esc(l.size)}<br><small>${rs(l.unit)}</small></span>
   <span><button class="btn g s" data-m="${i}">−</button> ${l.qty} <button class="btn g s" data-pl="${i}">+</button> <b style="color:var(--ink)">${rs(l.unit*l.qty)}</b></span></div>`).join('')}
   <div class="row"><span>Subtotal</span><span>${rs(sub)}</span></div>
   <label style="margin:6px 0">Extra discount (Rs.)<input id="bd" type="number" min="0" value="${window._bd||0}"></label>
   <div class="g2"><label>Customer name<input id="bn" placeholder="Walk-in"></label><label>Phone<input id="bp"></label></div>
   <label style="margin:6px 0">Payment<select id="bpm"><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>JazzCash/Easypaisa</option></select></label>
   <div class="row t"><span>Total</span><span id="bt">${rs(sub-(window._bd||0))}</span></div>
   <button class="btn" id="bs" style="width:100%;margin-top:8px">Complete Sale</button> <button class="btn g" id="bc" style="width:100%;margin-top:6px">Clear</button>`:'<span class="mut">Tap a size to add it to the bill.</span>';
  const d=$('#bd');if(d)d.oninput=()=>{window._bd=Math.max(0,+d.value||0);$('#bt').textContent=rs(Math.max(0,sub-window._bd))};
  $('#bl').onclick=async e=>{
    const m=e.target.closest('[data-m]'),pl=e.target.closest('[data-pl]');
    if(m){const l=bill[+m.dataset.m];l.qty--;if(l.qty<1)bill.splice(+m.dataset.m,1);return drawBill()}
    if(pl){const l=L[+pl.dataset.pl];if(l.qty<l.v.stock)bill[+pl.dataset.pl].qty++;return drawBill()}
    if(e.target.id==='bc'){bill=[];window._bd=0;return drawBill()}
    if(e.target.id==='bs'){
      try{const r=await api('admin/sale','POST',{items:bill,discount:window._bd||0,customerName:$('#bn').value,customerPhone:$('#bp').value,payment:$('#bpm').value});
        bill=[];window._bd=0;await load();saleDone(r.order)}catch(x){toast(x.message,1)}
    }
  };
}

// ---------- accounts ----------
let ACC={p:'month',from:'',to:''};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function accRange(){
  const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let f=null,t=null;
  if(ACC.p==='today')f=t0;
  else if(ACC.p==='7d'){f=new Date(t0);f.setDate(f.getDate()-6)}
  else if(ACC.p==='30d'){f=new Date(t0);f.setDate(f.getDate()-29)}
  else if(ACC.p==='month')f=new Date(n.getFullYear(),n.getMonth(),1);
  else if(ACC.p==='year')f=new Date(n.getFullYear(),0,1);
  else if(ACC.p==='custom'){f=ACC.from?new Date(ACC.from+'T00:00:00'):null;t=ACC.to?new Date(ACC.to+'T23:59:59'):null}
  return [f,t];
}
const oRev=o=>o.subtotal-o.discount;
const oCost=o=>o.lines.reduce((a,l)=>a+(l.cost||0)*l.qty,0);
const oItemDisc=o=>o.lines.reduce((a,l)=>a+(l.orig-l.unit)*l.qty,0);
function agg(list){
  const r={n:list.length,rev:0,cost:0,itemDisc:0,extraDisc:0,units:0,delivery:0,list:0};
  for(const o of list){r.rev+=oRev(o);r.cost+=oCost(o);r.itemDisc+=oItemDisc(o);r.extraDisc+=o.discount;r.delivery+=o.delivery;
    r.units+=o.lines.reduce((a,l)=>a+l.qty,0);r.list+=o.lines.reduce((a,l)=>a+l.orig*l.qty,0)}
  r.profit=r.rev-r.cost;return r;
}
const fmtK=n=>{n=Math.round(n);const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1)+'M':a>=1e3?(n/1e3).toFixed(a>=1e4?0:1)+'k':String(n)};
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));const r=m/p;return (r<=1?1:r<=2?2:r<=4?4:r<=5?5:10)*p}
function barChart(labels,series,H=230){
  const W=640,pl=46,pb=28,pt=14,pr=8,all=series.flatMap(s=>s.values);const nice=niceMax(Math.max(1,...all));
  const iw=W-pl-pr,ih=H-pt-pb,n=labels.length,gw=iw/n,bw=Math.min(24,(gw-6)/series.length);let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".13"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".7">${fmtK(nice*i/4)}</text>`}
  labels.forEach((lb,i)=>{const x0=pl+gw*i+(gw-bw*series.length)/2;
    series.forEach((s,j)=>{const v=Math.max(0,s.values[i]),bh=ih*v/nice;g+=`<rect x="${x0+bw*j}" y="${pt+ih-bh}" width="${bw-2}" height="${bh}" rx="3" fill="${s.color}"><title>${esc(lb)} · ${esc(s.name)}: ${rs(s.values[i])}</title></rect>`});
    g+=`<text x="${pl+gw*i+gw/2}" y="${H-9}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".8">${esc(lb)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--mute)">${g}</svg>`;
}
function lineChart(labels,values,H=200){
  const W=640,pl=46,pb=26,pt=12,pr=10,nice=niceMax(Math.max(1,...values)),iw=W-pl-pr,ih=H-pt-pb,n=values.length;
  const X=i=>pl+iw*i/(n-1||1),Y=v=>pt+ih-ih*v/nice;let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".13"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".7">${fmtK(nice*i/4)}</text>`}
  const pts=values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  g+=`<polygon points="${X(0)},${pt+ih} ${pts} ${X(n-1)},${pt+ih}" fill="var(--gold)" opacity=".15"/><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linejoin="round"/>`;
  values.forEach((v,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${v?3:0}" fill="var(--gold2)"><title>${esc(labels[i])}: ${rs(v)}</title></circle>`;if(i%5===0||i===n-1)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".8">${esc(labels[i])}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--mute)">${g}</svg>`;
}
function hbars(items,fmt=rs){
  items=items.filter(i=>i.v>0);const tot=items.reduce((a,i)=>a+i.v,0)||1,mx=Math.max(1,...items.map(i=>i.v));
  return items.length?items.map(i=>`<div class="hb"><div class="hl"><span>${esc(i.l)}</span><span>${Math.round(i.v/tot*100)}% · ${fmt(i.v)}</span></div><div class="ht"><i style="width:${i.v/mx*100}%"></i></div></div>`).join(''):'<span class="mut">No data yet.</span>';
}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const EXCAT=['Stock purchase','Packaging','Courier / Delivery','Ads / Marketing','Rent','Salary','Utilities','Other'];
function acc(){
  const live=D.orders.filter(o=>o.status!=='cancelled');
  const [f,t]=accRange();
  const inR=d=>{const x=new Date(d);return (!f||x>=f)&&(!t||x<=t)};
  const L=live.filter(o=>inR(o.createdAt));

  const exAll=D.expenses||[];
  const exR=exAll.filter(e=>(!f||e.date>=ymd(f))&&(!t||e.date<=ymd(t)));
  const exTot=exR.reduce((a,e)=>a+e.amount,0),net=A.profit-exTot;
  const disc=A.itemDisc+A.extraDisc,noCost=L.filter(o=>o.lines.some(l=>!l.cost)).length;
  const prodCat={};D.products.forEach(p=>prodCat[p.id]=p.category);
  // charts data

  const mRev=months.map(m=>agg(live.filter(o=>{const d=new Date(o.createdAt);return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth()})));

  const dVals=days.map(d=>{const k=d.toDateString();return live.filter(o=>new Date(o.createdAt).toDateString()===k).reduce((a,o)=>a+oRev(o),0)});

  const bl=Object.values(bs).sort((a,b)=>b.u-a.u),tu=bl.reduce((a,x)=>a+x.u,0)||1,tr=bl.reduce((a,x)=>a+x.rev,0)||1;

  const byCat=grp((o,l)=>({men:'Men',women:'Women',unisex:'Unisex'}[prodCat[l.pid]]||'Other'),(o,l)=>l.total);
  const bySize=grp((o,l)=>l.size,(o,l)=>l.total);
  const byPay=Object.entries(L.reduce((m,o)=>{m[o.payment]=(m[o.payment]||0)+o.total;return m},{})).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v);
  const bySrc=[{l:'Online orders',v:L.filter(o=>o.source!=='store').reduce((a,o)=>a+o.total,0)},{l:'In-store sales',v:L.filter(o=>o.source==='store').reduce((a,o)=>a+o.total,0)}];
  const byCity=Object.entries(L.reduce((m,o)=>{const c=(o.customer.city||'').trim().toLowerCase();if(c)m[c]=(m[c]||0)+o.total;return m},{})).map(([l,v])=>({l:l.replace(/\b\w/g,x=>x.toUpperCase()),v})).sort((a,b)=>b.v-a.v).slice(0,8);
  // customers
  const cm={};live.forEach(o=>{const k=String(o.customer.phone||'').replace(/\D/g,'');if(!k)return;const c=cm[k]=cm[k]||{name:o.customer.name,phone:o.customer.phone,n:0,spent:0,last:o.createdAt};c.n++;c.spent+=o.total;if(o.createdAt>c.last){c.last=o.createdAt;c.name=o.customer.name}});
  const cust=Object.values(cm).sort((a,b)=>b.spent-a.spent),repeat=cust.filter(c=>c.n>1).length;
  // stock value
  let sUnits=0,sCost=0,sRetail=0;D.products.forEach(p=>p.variants.forEach(v=>{sUnits+=v.stock;sCost+=v.stock*(v.cost||0);sRetail+=v.stock*v.price}));

  M(`<h2>Accounts</h2>
  <div class="bar"><span id="periods" style="display:flex;gap:6px;flex-wrap:wrap">${chips.map(([k,v])=>`<button class="btn ${ACC.p===k?'':'g'} s" data-p="${k}">${v}</button>`).join('')}</span>
   ${ACC.p==='custom'?`<input type="date" id="af" value="${ACC.from}" style="min-width:0"><input type="date" id="at" value="${ACC.to}" style="min-width:0">`:''}
   <button class="btn g s" id="csv">Download Excel/CSV</button></div>
  <div class="cards">
   ${kpi('Sales (after discount)',rs(A.rev),`${A.n} orders · ${A.units} perfumes`)}

  <div class="panel"><h2 style="font-size:20px">Yearly sales & profit</h2><div class="lg"><i style="background:var(--gold)"></i>Sales <i style="background:#4fbf78"></i>Profit</div>${barChart(years.map(String),[{name:'Sales',color:'#c9a24b',values:yAgg.map(x=>x.rev)},{name:'Profit',color:'#4fbf78',values:yAgg.map(x=>x.profit)}])}</div></div>

  <div class="panel"><h2 style="font-size:20px">Best selling perfumes</h2>${bl.length?`<table><thead><tr><th>Perfume</th><th>Units</th><th>% of units</th><th>Sales</th><th>% of sales</th><th>Profit</th></tr></thead><tbody>${bl.map(x=>`<tr><td><b>${esc(x.n)}</b><div class="ht"><i style="width:${x.u/bl[0].u*100}%"></i></div></td><td>${x.u}</td><td>${(x.u/tu*100).toFixed(1)}%</td><td>${rs(x.rev)}</td><td>${(x.rev/tr*100).toFixed(1)}%</td><td>${rs(x.rev-x.cost)}</td></tr>`).join('')}</tbody></table>`:'<span class="mut">No sales in this period.</span>'}
   ${slow.length?`<div style="margin-top:12px"><b>Not selling in this period:</b> <span class="mut">${slow.map(p=>esc(p.name)).join(', ')}</span></div>`:''}</div>

  <div class="panel"><h2 style="font-size:20px">Discount details</h2><div class="row"><span>Product discounts (sale prices)</span><span>${rs(A.itemDisc)}</span></div><div class="row"><span>Coupons & extra discounts</span><span>${rs(A.extraDisc)}</span></div><div class="row t"><span>Total given</span><span>${rs(disc)}</span></div>
   <div class="mut" style="margin-top:8px;font-size:12px">Without any discount your sales would have been ${rs(A.list)}.</div>
   <h2 style="font-size:20px;margin-top:16px">Stock value (right now)</h2><div class="row"><span>Perfumes in stock</span><span>${sUnits}</span></div><div class="row"><span>Value at cost</span><span>${rs(sCost)}</span></div><div class="row"><span>Value at selling price</span><span>${rs(sRetail)}</span></div><div class="row t"><span>Possible profit</span><span>${rs(sRetail-sCost)}</span></div></div></div>
  <div class="panel"><h2 style="font-size:20px">Top customers</h2><div class="mut" style="margin-bottom:6px">${cust.length} customers · ${repeat} came back again</div>${cust.length?`<table><thead><tr><th>Customer</th><th>Phone</th><th>Orders</th><th>Total spent</th><th>Last order</th></tr></thead><tbody>${cust.slice(0,10).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.n}</td><td>${rs(c.spent)}</td><td>${new Date(c.last).toLocaleDateString('en-GB')}</td></tr>`).join('')}</tbody></table>`:'<span class="mut">No customers yet.</span>'}</div>
  <div class="panel"><h2 style="font-size:20px">Expenses</h2><div class="mut" style="margin-bottom:8px">Rent, courier, packaging, ads... add them here so net profit is real.</div>
   <div class="g3" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px"><label>Date<input type="date" id="xd" value="${ymd(new Date())}"></label><label>Category<select id="xc">${EXCAT.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Note<input id="xn" placeholder="optional"></label><label>Amount (Rs.)<input id="xa" type="number" min="1"></label><label>&nbsp;<button class="btn" id="xadd">Add</button></label></div>
   ${exR.length?`<table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr></thead><tbody>${exR.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.note)}</td><td>${rs(e.amount)}</td><td><button class="btn r s" data-xd="${e.id}">Delete</button></td></tr>`).join('')}</tbody></table>`:'<span class="mut">No expenses in this period.</span>'}</div>`);
  $('#main').onclick=async e=>{
    const p=e.target.closest('[data-p]');if(p){ACC.p=p.dataset.p;return acc()}
    if(e.target.id==='csv')return csvOut(L);
    const xd=e.target.closest('[data-xd]');if(xd&&confirm('Delete this expense?')){await api('admin/expense/'+xd.dataset.xd,'DELETE');await load();return}
    if(e.target.id==='xadd'){try{await api('admin/expense','POST',{date:$('#xd').value,category:$('#xc').value,note:$('#xn').value,amount:+$('#xa').value});toast('Expense added');await load()}catch(x){toast(x.message,1)}}
  };
  $('#main').onchange=e=>{if(e.target.id==='af'){ACC.from=e.target.value;acc()}if(e.target.id==='at'){ACC.to=e.target.value;acc()}};
}
function csvOut(list){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Order','Date','Type','Status','Customer','Phone','City','Items','Sales','Discount','Delivery','Total','Cost','Profit','Payment']];
  list.forEach(o=>rows.push([o.id,new Date(o.createdAt).toLocaleString('en-GB'),o.source,o.status,o.customer.name,o.customer.phone,o.customer.city,o.lines.map(l=>l.name+' '+l.size+' x'+l.qty).join('; '),o.subtotal,oItemDisc(o)+o.discount,o.delivery,o.total,oCost(o),oRev(o)-oCost(o),o.payment]));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zeen-sales-'+ymd(new Date())+'.csv';a.click();
}

// ---------- design (colors, logo, hero image) ----------
const PRESETS={
 'Green & Gold':{bg:'#0d2019',card:'#163226',accent:'#c9a24b',ink:'#f4efe3'},
 'Purple-Navy & Gold':{bg:'#120f2b',card:'#221d52',accent:'#d4af5a',ink:'#f6f1e6'},
 'Black & Gold':{bg:'#0b0b0c',card:'#1b1b1e',accent:'#c9a24b',ink:'#f5f1e8'},
 'Rose & Gold':{bg:'#2a1418',card:'#3d1f26',accent:'#d9a58a',ink:'#fbeee8'},
 'Cream & Gold (light)':{bg:'#faf6ee',card:'#fffdf8',accent:'#a67c1a',ink:'#2b2417'}};
let dsn=null;
function designHtml(){
  const s=D.settings;dsn={theme:{...s.theme},logo:s.logo||'',heroImage:s.heroImage||''};
  const cf=(k,l)=>`<label>${l}<input type="color" data-ck="${k}" value="${dsn.theme[k]}" style="height:44px;padding:3px"></label>`;
  return `<div class="panel" id="design" style="display:grid;gap:14px"><h2 style="font-size:20px;margin:0">Website Design</h2>
  <div><div class="mut" style="margin-bottom:6px">Quick styles (tap one, then Save Design)</div><div class="bar" style="margin:0" id="presets">${Object.keys(PRESETS).map(n=>`<button class="btn g s" data-pr="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>
  <div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">${cf('bg','Background')}${cf('card','Cards / boxes')}${cf('accent','Gold / buttons')}${cf('ink','Text')}</div>
  <div id="pv"></div>
  <div class="g2"><div><div class="mut" style="margin-bottom:6px">Logo (PNG with transparent background is best)</div><div id="dlogo"></div></div>
  <div><div class="mut" style="margin-bottom:6px">Home page main picture (optional, replaces the bottle drawing)</div><div id="dhero"></div></div></div>
  <div><button class="btn" id="sd">Save Design</button></div></div>`;
}
function designInit(){
  const draw=()=>{
    const t=dsn.theme;
    $('#pv').innerHTML=`<div style="background:${t.bg};border:1px solid ${t.accent}55;border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      ${dsn.logo?`<img src="/api/img/${dsn.logo}" style="width:54px;height:54px;object-fit:contain;border-radius:50%">`:`<div style="width:54px;height:54px;border-radius:50%;border:1.5px solid ${t.accent};color:${t.accent};display:grid;place-items:center;font:600 28px Georgia,serif">Z</div>`}
      <div style="flex:1;min-width:150px"><div style="font:600 24px Georgia,serif;color:${t.accent}">Zeen's Fragrance</div><div style="color:${t.ink};opacity:.75;font-size:13px">Preview of your website colors</div></div>
      <div style="background:${t.card};color:${t.ink};border:1px solid ${t.accent}66;border-radius:10px;padding:10px 14px;font-size:13px">Product card</div>
      <div style="background:${t.accent};color:${t.bg};border-radius:999px;padding:9px 18px;font-weight:600;font-size:13px">Shop Now</div></div>`;
    document.querySelectorAll('[data-ck]').forEach(i=>i.value=dsn.theme[i.dataset.ck]);
    const box=(k,id,lbl)=>{$(id).innerHTML=(dsn[k]?`<div class="im" style="display:inline-block"><img src="/api/img/${dsn[k]}" style="width:${k==='logo'?96:140}px;height:96px;object-fit:${k==='logo'?'contain':'cover'};background:#8883"><button data-rm="${k}">×</button></div>`:`<label class="add" style="width:${k==='logo'?96:140}px;height:96px">+ ${lbl}<input type="file" accept="image/*" data-up="${k}" hidden></label>`)};
    box('logo','#dlogo','Upload logo');box('heroImage','#dhero','Upload picture');
  };
  draw();
  const d=$('#design');
  d.oninput=e=>{const k=e.target.dataset.ck;if(k){dsn.theme[k]=e.target.value;draw()}};
  d.onclick=async e=>{
    const p=e.target.closest('[data-pr]');if(p){Object.assign(dsn.theme,PRESETS[p.dataset.pr]);return draw()}
    const r=e.target.closest('[data-rm]');if(r){dsn[r.dataset.rm]='';return draw()}
    if(e.target.id==='sd'){try{await api('admin/settings','POST',{...D.settings,theme:dsn.theme,logo:dsn.logo,heroImage:dsn.heroImage});toast('Design saved. Open the shop to see it.');await load()}catch(x){toast(x.message,1)}}
  };
  d.onchange=async e=>{const k=e.target.dataset.up;if(!k)return;const f=e.target.files[0];if(!f)return;
    try{const logo=k==='logo';const dataUrl=await resize(f,logo?480:1200,logo?'image/webp':'image/jpeg',logo?.92:.8);
      const r=await api('admin/image','POST',{dataUrl});dsn[k]=r.id;draw()}catch(x){toast(x.message,1)}};
}

// ---------- settings ----------
function set(){
  const s=D.settings;
  const f=(id,l,v,t='text')=>`<label>${l}<input id="s_${id}" type="${t}" value="${esc(v)}"></label>`;
  M(`<h2>Settings</h2>${designHtml()}<div class="panel" style="display:grid;gap:12px">
  <div class="g2">${f('shopName','Shop name',s.shopName)}${f('tagline','Tagline',s.tagline)}</div>
  <div class="g2">${f('heroTitle','Homepage heading',s.heroTitle)}${f('heroSub','Homepage sub-heading',s.heroSub)}</div>
  ${f('announcement','Top announcement bar (leave empty to hide)',s.announcement)}
  <div class="g2">${f('whatsapp','WhatsApp number (with country code, e.g. 923001234567)',s.whatsapp)}${f('phone','Phone (shown in footer)',s.phone)}</div>
  <div class="g2">${f('address','Address (footer)',s.address)}${f('instagram','Instagram / Facebook',s.instagram)}</div>
  <div class="g2">${f('deliveryCharge','Delivery charge (Rs.)',s.deliveryCharge,'number')}${f('freeDeliveryAbove','Free delivery above (Rs., 0 = never)',s.freeDeliveryAbove,'number')}</div>
  ${f('invoiceNote','Thank-you note on invoice / slip',s.invoiceNote)}
  ${f('invoiceTerms','Terms on invoice (optional, e.g. return policy)',s.invoiceTerms)}
  <div><button class="btn" id="ss">Save Settings</button></div></div>`);
  designInit();$('#ss').onclick=async()=>{const g=id=>$('#s_'+id).value;
    await api('admin/settings','POST',{shopName:g('shopName'),tagline:g('tagline'),heroTitle:g('heroTitle'),heroSub:g('heroSub'),announcement:g('announcement'),whatsapp:g('whatsapp'),phone:g('phone'),address:g('address'),instagram:g('instagram'),deliveryCharge:+g('deliveryCharge'),freeDeliveryAbove:+g('freeDeliveryAbove'),invoiceNote:g('invoiceNote'),invoiceTerms:g('invoiceTerms'),globalDiscount:D.settings.globalDiscount});
    toast('Saved');await load()};
}
load();
</script>
